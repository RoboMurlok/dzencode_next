version: "3.9"

services:
  client:
    build: ./client
    ports:
      - "3000:3000"
    depends_on:
      - api

  api:
    build: ./server
    ports:
      - "5000:5000"
    depends_on:
      - db
    env_file:
      - ./server/.env  
    # environment:
    #   - DB_HOST=db
    #   - DB_USER=root
    #   - DB_PASSWORD=root
    #   - DB_NAME=dzencode
    #   - DB_PORT=3306

  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dzencode
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: